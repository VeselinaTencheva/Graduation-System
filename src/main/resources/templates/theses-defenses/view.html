<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: header('View Thesis Defense')">
</head>
<body>
    <nav th:replace="fragments/layout :: navigation"></nav>
    
    <div class="container">
        <div th:replace="fragments/layout :: message"></div>

        <h2>Thesis Defense Details</h2>

        <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Thesis:</strong></div>
                    <div class="col-sm-9" th:text="${defense.thesis.title}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Defense Date:</strong></div>
                    <div class="col-sm-9" th:text="${defense.session.defenseDate}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Grade:</strong></div>
                    <div class="col-sm-9" th:text="${defense.grade}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Session Info:</strong></div>
                   <div class="col-sm-9" th:text="${defense.grade}"></div> <!--  TODO add link to session id -->
                </div>
                <div class="row mb-3">
                    <div class="col-sm-3"><strong>Student FN:</strong></div>
                    <div class="col-sm-9" th:text="${defense.thesis.thesisApplication.student.facultyNumber}"></div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
